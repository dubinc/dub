name: DeepSec PR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepsec-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .deepsec
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch PR base
        working-directory: .
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$PR_BASE_REF"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .deepsec/pnpm-lock.yaml

      - name: Install DeepSec
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          test -x node_modules/.bin/deepsec

      - name: List changed apps/web files
        id: files
        working-directory: .
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p .deepsec
          .deepsec/scripts/list-pr-files.sh "origin/${PR_BASE_REF}...HEAD" \
            > .deepsec/pr-files.txt
          if [ -s .deepsec/pr-files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            cat .deepsec/pr-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No in-scope apps/web files to review."
          fi

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
      # the Codex bubblewrap sandbox cannot start and every shell call fails.
      - name: Allow the Codex sandbox
        if: steps.files.outputs.has_files == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Review diff
        id: deepsec
        if: steps.files.outputs.has_files == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_AI_GATEWAY_API_KEY }}
        run: |
          pnpm exec deepsec process \
            --project-id web \
            --files-from pr-files.txt \
            --reinvestigate \
            --comment-out "${{ github.workspace }}/.deepsec/comment.md"

      - name: Upload PR comment
        if: always() && hashFiles('.deepsec/comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-comment
          path: .deepsec/comment.md
          include-hidden-files: true
          retention-days: 1

  comment:
    needs: analyze
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deepsec-comment
          path: .deepsec

      - if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('.deepsec/comment.md', 'utf8'),
            });
