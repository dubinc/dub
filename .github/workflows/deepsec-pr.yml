name: DeepSec PR

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".deepsec/**"
      - ".github/workflows/deepsec-pr.yml"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .deepsec
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base
        working-directory: .
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .deepsec/pnpm-lock.yaml

      - name: Install DeepSec
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          test -x node_modules/.bin/deepsec

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: List changed apps/web files
        id: files
        working-directory: .
        run: |
          mkdir -p .deepsec
          .deepsec/scripts/list-pr-files.sh "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            > .deepsec/pr-files.txt
          if [ -s .deepsec/pr-files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            cat .deepsec/pr-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No in-scope apps/web files to review."
          fi

      - name: Review diff
        id: deepsec
        if: steps.files.outputs.has_files == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_AI_GATEWAY_API_KEY }}
        run: |
          pnpm exec deepsec process \
            --project-id web \
            --files-from pr-files.txt \
            --comment-out "${{ github.workspace }}/comment.md"

      - name: Upload PR comment
        if: always() && hashFiles('comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-comment
          path: comment.md
          retention-days: 1

  comment:
    needs: analyze
    if: always() && needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deepsec-comment

      - if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('comment.md', 'utf8'),
            });

      - name: Notify Slack
        if: steps.dl.outcome == 'success'
        env:
          DEEPSEC_SLACK_HOOK: ${{ secrets.DEEPSEC_SLACK_HOOK }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$DEEPSEC_SLACK_HOOK" ]; then
            echo "DEEPSEC_SLACK_HOOK is not set; skipping Slack notify."
            exit 0
          fi
          node <<'EOF'
          const fs = require("fs");
          const hook = process.env.DEEPSEC_SLACK_HOOK;
          const prUrl = process.env.PR_URL;
          const prTitle = (process.env.PR_TITLE || "PR").replace(/[<>&]/g, "");
          const prNumber = process.env.PR_NUMBER;
          const findings = fs.readFileSync("comment.md", "utf8").slice(0, 2200);
          const text = [
            `:alert: DeepSec findings on <${prUrl}|#${prNumber} ${prTitle}>`,
            "",
            findings,
          ].join("\n").slice(0, 2900);

          fetch(hook, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              blocks: [{ type: "section", text: { type: "mrkdwn", text } }],
            }),
          }).then(async (res) => {
            if (!res.ok) {
              console.error(`Slack webhook failed (${res.status}): ${await res.text()}`);
              process.exit(1);
            }
            console.log("Posted DeepSec PR findings to Slack.");
          });
          EOF
