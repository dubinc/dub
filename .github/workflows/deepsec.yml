name: DeepSec full scan

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent backend (must match the model)
        required: true
        type: choice
        options:
          - codex
          - claude
        default: codex
      model:
        description: Model for process and revalidate
        required: true
        type: choice
        options:
          - gpt-5.5
          - gpt-5.5-pro
          - gpt-5.4
          - claude-opus-4-8
          - claude-sonnet-4-6
        default: gpt-5.5
      thinking_level:
        description: Reasoning effort (xhigh finds more, costs more)
        required: true
        type: choice
        options:
          - xhigh
          - high
          - medium
        default: xhigh

permissions:
  contents: read

concurrency:
  group: deepsec-full
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: .deepsec
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.DEEPSEC_VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.DEEPSEC_VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DEEPSEC_VERCEL_PROJECT_ID }}
      DEEPSEC_AGENT: ${{ inputs.agent }}
      DEEPSEC_MODEL: ${{ inputs.model }}
      DEEPSEC_THINKING_LEVEL: ${{ inputs.thinking_level }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check agent and model
        working-directory: .
        run: |
          echo "agent=${DEEPSEC_AGENT} model=${DEEPSEC_MODEL} thinking=${DEEPSEC_THINKING_LEVEL}"
          case "${DEEPSEC_AGENT}:${DEEPSEC_MODEL}" in
            codex:gpt-*) ;;
            claude:claude-*) ;;
            *)
              echo "Model ${DEEPSEC_MODEL} does not match agent ${DEEPSEC_AGENT}."
              echo "Use gpt-* with codex, or claude-* with claude."
              exit 1
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .deepsec/pnpm-lock.yaml

      - name: Install DeepSec
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          test -x node_modules/.bin/deepsec

      - name: Restore file records
        uses: actions/cache@v4
        with:
          path: .deepsec/data/web/files
          key: deepsec-web-files-${{ github.run_id }}
          restore-keys: |
            deepsec-web-files-

      - name: Scan
        run: pnpm exec deepsec scan --project-id web

      - name: Process in Vercel Sandboxes
        id: process
        continue-on-error: true
        run: |
          pnpm exec deepsec sandbox process \
            --project-id web \
            --agent "${DEEPSEC_AGENT}" \
            --model "${DEEPSEC_MODEL}" \
            --thinking-level "${DEEPSEC_THINKING_LEVEL}" \
            --sandboxes 10 \
            --concurrency 4 \
            --timeout 18000000

      - name: Revalidate HIGH+
        id: revalidate
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pnpm exec deepsec revalidate \
            --project-id web \
            --min-severity HIGH \
            --agent "${DEEPSEC_AGENT}" \
            --model "${DEEPSEC_MODEL}" \
            --thinking-level "${DEEPSEC_THINKING_LEVEL}"

      - name: Export findings
        if: ${{ !cancelled() }}
        run: |
          pnpm exec deepsec export \
            --project-id web \
            --format json \
            --min-severity HIGH \
            --out findings.json
          pnpm exec deepsec export \
            --project-id web \
            --format md-dir \
            --min-severity HIGH \
            --out ./findings

      - name: Notify Slack
        if: ${{ !cancelled() && steps.process.outcome == 'success' && steps.revalidate.outcome == 'success' }}
        env:
          DEEPSEC_SLACK_HOOK: ${{ secrets.DEEPSEC_SLACK_HOOK }}
        run: pnpm notify-slack findings.json

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-full-findings
          path: |
            .deepsec/findings.json
            .deepsec/findings
            .deepsec/data/web/files
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if process or revalidate errored
        if: ${{ !cancelled() && (steps.process.outcome == 'failure' || steps.revalidate.outcome == 'failure') }}
        run: |
          echo "process=${{ steps.process.outcome }} revalidate=${{ steps.revalidate.outcome }}"
          echo "DeepSec exited non-zero. Re-run this workflow with the same agent/model; finished files are kept and pending files resume."
          exit 1
